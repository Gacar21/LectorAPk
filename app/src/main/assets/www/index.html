<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Lector Docs</title>
  <link rel="stylesheet" href="styles.css">
  <script src="lib/jszip.min.js"></script>
  <script src="lib/docx-preview.min.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>

  <!-- ============ BIENVENIDA ============ -->
  <div id="splash" class="splash" aria-hidden="true">
    <img src="decom-logo.png" alt="">
    <p class="splash-brand">DECOM</p>
    <p class="splash-sub">Lector Docs</p>
  </div>

  <!-- ============ INICIO ============ -->
  <main id="home" class="screen">
    <header class="home-head">
      <div class="head-row">
        <p class="eyebrow">Lector Docs</p>
        <img class="corner-logo" src="decom-logo.png" alt="DECOM">
      </div>
      <h1>Tus documentos,<br><em>a la mano.</em></h1>
      <p class="lede">Abre PDF, Word y PowerPoint directamente en tu teléfono.</p>
    </header>

    <button id="btnOpen" class="btn-primary" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v1H4z"/><path d="M3 10h18l-1.6 8.1A2 2 0 0 1 17.4 20H6.6a2 2 0 0 1-2-1.9z"/></svg>
      Abrir documento
    </button>

    <section class="formats" aria-label="Formatos compatibles">
      <button class="fmt" data-kind="pdf" type="button"><span class="fmt-tag">PDF</span><span class="fmt-name">Documentos PDF</span></button>
      <button class="fmt" data-kind="docx" type="button"><span class="fmt-tag">DOCX</span><span class="fmt-name">Word</span></button>
      <button class="fmt" data-kind="pptx" type="button"><span class="fmt-tag">PPTX</span><span class="fmt-name">PowerPoint</span></button>
    </section>

    <section class="recent">
      <div class="section-head">
        <h2>Recientes</h2>
        <button id="btnClearRecent" class="link" type="button" hidden>Limpiar</button>
      </div>
      <ul id="recentList"></ul>
      <p id="recentEmpty" class="empty">Aquí aparecerán los últimos documentos que abras.</p>
    </section>

    <footer class="home-foot">Funciona sin internet · Tus archivos no salen del teléfono</footer>
  </main>

  <!-- ============ VISOR ============ -->
  <section id="viewer" class="screen" hidden>
    <header class="bar">
      <button id="btnBack" class="icon" type="button" aria-label="Volver">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="bar-title">
        <span id="docKind" class="kind"></span>
        <span id="docTitle" class="title"></span>
      </div>
      <button id="btnNight" class="icon" type="button" aria-label="Modo nocturno">
        <svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      </button>
      <button id="btnShare" class="icon" type="button" aria-label="Compartir">
        <svg viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.8l7.6-4.4M8.2 13.2l7.6 4.4"/></g></svg>
      </button>
    </header>

    <div id="scroller" class="scroller">
      <div id="content" class="content"></div>
    </div>

    <div class="dock" id="dock">
      <button id="btnPage" class="pill" type="button" aria-label="Ir a página"><span id="pageInfo">–</span></button>
      <div class="zoom">
        <button id="btnZoomOut" class="icon small" type="button" aria-label="Alejar">
          <svg viewBox="0 0 24 24"><path d="M6 12h12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        </button>
        <span id="zoomInfo">100%</span>
        <button id="btnZoomIn" class="icon small" type="button" aria-label="Acercar">
          <svg viewBox="0 0 24 24"><path d="M6 12h12M12 6v12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>

    <div id="loading" class="loading" hidden>
      <div class="spinner"></div>
      <p id="loadingText">Abriendo…</p>
    </div>

    <div id="error" class="error" hidden>
      <p class="error-title">No se pudo abrir</p>
      <p id="errorText"></p>
      <button id="btnErrorBack" class="btn-primary small" type="button">Volver</button>
    </div>
  </section>

  <!-- ============ DIÁLOGO ============ -->
  <div id="dialog" class="dialog" hidden>
    <form id="dialogForm" class="dialog-card">
      <p id="dialogTitle" class="dialog-title"></p>
      <input id="dialogInput" autocomplete="off">
      <div class="dialog-actions">
        <button type="button" id="dialogCancel" class="link">Cancelar</button>
        <button type="submit" class="btn-primary small">Aceptar</button>
      </div>
    </form>
  </div>

  <div id="toast" class="toast" hidden></div>
  <input id="fileInput" type="file" accept=".pdf,.docx,.pptx,.ppsx,application/pdf" hidden>
</body>
</html>
